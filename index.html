<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livvae</title>
  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    // Enlace de App Store para iPhone
    const appStoreUrl = "https://apps.apple.com/es/app/livvae/id6760459143";

    // Intent de Android: abre la app directamente o salta a Google Play si no existe
    const androidIntent = "intent://#Intent;package=digifit.android.virtuagym.pro.entrenate;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Ddigifit.android.virtuagym.pro.entrenate;end;";

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.href = "virtuagym://";
      setTimeout(function() {
        window.location.replace(appStoreUrl);
      }, 1500);
    } else if (/android/i.test(ua)) {
      window.location.href = androidIntent;
    } else {
      window.location.replace("https://play.google.com/store/apps/details?id=digifit.android.virtuagym.pro.entrenate");
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Abriendo Livvae...</p>
</body>
</html>
