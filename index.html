<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livvae</title>
  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /android/i.test(ua);

    if (isIOS) {
      window.location.replace("https://apps.apple.com/es/app/livvae/id6760459143");
    } else if (isAndroid) {
      window.location.replace("https://play.google.com/store/apps/details?id=digifit.android.virtuagym.pro.entrenate");
    } else {
      window.location.replace("https://livvae.com/");
    }
  </script>
</head>
<body style="background-color: #ffffff; margin: 0;">
</body>
</html>
