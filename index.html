<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livvae</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 85vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
    }
    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #111;
    }
    p {
      color: #666;
      font-size: 14px;
      margin: 0 0 20px;
    }
    .btn {
      display: block;
      background-color: #007aff;
      color: #ffffff;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .btn-secondary {
      background-color: #e5e5ea;
      color: #333333;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Abriendo Livvae...</h2>
    <p>Si la aplicación no se abre automáticamente en 2 segundos, pulsa aquí:</p>
    
    <a id="btnAbrir" class="btn" href="#">Abrir App</a>
    <a id="btnDescargar" class="btn btn-secondary" href="#">Descargar en la Tienda</a>
  </div>

  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /android/i.test(ua);

    // Identificadores de Livvae
    const ANDROID_PKG = "digifit.android.virtuagym.pro.entrenate";
    const PLAY_STORE = "https://play.google.com/store/apps/details?id=" + ANDROID_PKG;
    const IOS_STORE = "https://apps.apple.com/es/app/livvae/id6760459143";
    const WEB_DESKTOP = "https://livvae.com/";

    // Protocolo directo sin bloqueo de seguridad
    const INTENT_ANDROID = "intent://#Intent;scheme=virtuagym;package=" + ANDROID_PKG + ";end;";
    const SCHEME_IOS = "virtuagym://";

    const btnAbrir = document.getElementById("btnAbrir");
    const btnDescargar = document.getElementById("btnDescargar");

    if (isAndroid) {
      btnAbrir.href = INTENT_ANDROID;
      btnDescargar.href = PLAY_STORE;

      // Lanzamiento automático
      window.location.href = INTENT_ANDROID;
    } else if (isIOS) {
      btnAbrir.href = SCHEME_IOS;
      btnDescargar.href = IOS_STORE;

      // Lanzamiento automático en iOS
      window.location.href = SCHEME_IOS;
      setTimeout(function() {
        if (!document.hidden) {
          window.location.replace(IOS_STORE);
        }
      }, 2000);
    } else {
      window.location.replace(WEB_DESKTOP);
    }
  </script>
</body>
</html>
