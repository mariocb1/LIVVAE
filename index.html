<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar Livvae</title>
  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const appStoreUrl = "https://apps.apple.com/es/app/livvae/id6760459143";
    const playStoreUrl = "https://play.google.com/store/apps/details?id=digifit.android.virtuagym.pro.entrenate";

    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(appStoreUrl);
    } else if (/android/i.test(ua)) {
      window.location.replace(playStoreUrl);
    } else {
      window.location.replace(playStoreUrl);
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Redirigiendo a la tienda de aplicaciones...</p>
</body>
</html>
