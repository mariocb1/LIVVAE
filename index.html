<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livvae</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p id="msg">Abriendo Livvae...</p>

  <script>
    // ==== IDENTIFICADORES DE LIVVAE ====
    const APP_SCHEME = "virtuagym://";
    const IOS_APP_STORE_URL = "https://apps.apple.com/es/app/livvae/id6760459143";
    const ANDROID_PACKAGE = "digifit.android.virtuagym.pro.entrenate";
    const ANDROID_PLAY_URL = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE;
    const WEB_DESKTOP_URL = "https://livvae.com/"; // Web oficial para ordenadores
    // ====================================

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /android/i.test(ua);

    function goToStoreIfStillHere(storeUrl, delay) {
      let redirected = false;
      const timer = setTimeout(function () {
        if (!redirected) {
          window.location.replace(storeUrl);
        }
      }, delay);

      function onHide() {
        if (document.hidden) {
          redirected = true;
          clearTimeout(timer);
        }
      }
      document.addEventListener("visibilitychange", onHide);
      window.addEventListener("pagehide", onHide);
    }

    if (isIOS) {
      goToStoreIfStillHere(IOS_APP_STORE_URL, 1500);
      window.location.href = APP_SCHEME;
    } else if (isAndroid) {
      // Abre la app directamente por su paquete. Si no existe, va al Play Store
      const androidIntent =
        "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=" +
        ANDROID_PACKAGE +
        ";S.browser_fallback_url=" + encodeURIComponent(ANDROID_PLAY_URL) +
        ";end;";
      window.location.href = androidIntent;
    } else {
      // Si se abre desde un PC / Escritorio
      window.location.replace(WEB_DESKTOP_URL);
    }
  </script>
</body>
</html>
