<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livvae</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #ffffff;
    }
    .btn {
      display: inline-block;
      background-color: #01875f;
      color: #ffffff;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
  <script>
    window.onload = function() {
      // 1. Identificadores y enlaces
      var packageName = "digifit.android.virtuagym.pro.entrenate";
      var iosStoreUrl = "https://apps.apple.com/es/app/livvae/id6760459143";
      var playStoreUrl = "https://play.google.com/store/apps/details?id=" + packageName;
      var webDesktopUrl = "https://livvae.com/";

      // 2. Detección de dispositivo
      var ua = navigator.userAgent || navigator.vendor || window.opera;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isAndroid = /android/i.test(ua);

      if (isAndroid) {
        // Intent URI con acción MAIN / LAUNCHER y fallback directo a Google Play
        var intentUrl = "intent:#Intent;" +
                        "action=android.intent.action.MAIN;" +
                        "category=android.intent.category.LAUNCHER;" +
                        "package=" + packageName + ";" +
                        "S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) + ";" +
                        "end";
        
        document.getElementById("action-btn").href = intentUrl;
        document.getElementById("action-btn").innerText = "Abrir Livvae";
        window.location.replace(intentUrl);

      } else if (isIOS) {
        document.getElementById("action-btn").href = "virtuagym://";
        document.getElementById("action-btn").innerText = "Abrir Livvae";
        window.location.replace("virtuagym://");

        setTimeout(function() {
          if (!document.hidden) {
            window.location.replace(iosStoreUrl);
          }
        }, 1500); // 1500 milisegundos de margen

      } else {
        // Escritorio / PC
        window.location.replace(webDesktopUrl);
      }
    };
  </script>
</head>
<body>
  <h2>Abriendo Livvae...</h2>
  <p>Si la aplicación no se abre automáticamente en 2 segundos, pulsa el botón:</p>
  <a id="action-btn" class="btn" href="https://play.google.com/store/apps/details?id=digifit.android.virtuagym.pro.entrenate">
    Abrir aplicación
  </a>
</body>
</html>
